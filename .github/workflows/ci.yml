name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check generated catalog
        run: python scripts/sync_catalog.py --check

      - name: Python syntax
        run: python -m py_compile server.py document_formula.py addon_host.py addin_registration.py audio_encoding.py tray_app.py "Kokoro TTS.pyw" tts_catalog.py windows_protocol.py windows_runtime.py windows_startup.py scripts/sync_catalog.py

      - name: Bundled FFmpeg check
        run: python -c "from audio_encoding import validate_ffmpeg; validate_ffmpeg()"

      - name: Python tests
        run: python -m pytest tests -v

      - name: JavaScript syntax and tests
        run: |
          node --check tts-userscript.js
          node --test tests/office-addins-core.test.cjs tests/userscript-core.test.cjs

      - name: Dependency check
        run: python -m pip check
